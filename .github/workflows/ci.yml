name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Muse and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install -e ".[dev]"
      - name: Run existing unittest suite
        run: python -m unittest discover -v tests
      - name: Run complete pytest suite
        run: python -m pytest -q
      - name: Validate MUSE-GM configuration
        run: python -m muse_gm check
      - name: Compile existing Python modules
        run: |
          python -m py_compile muse_core/muse_engine.py muse_core/muse_lifestory.py muse_core/muse_wizard.py muse_core/muse_prose.py muse_core/muse_bridge.py
          python -m py_compile muse_gm/app.py
